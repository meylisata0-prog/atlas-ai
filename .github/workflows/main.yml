name: Build Atlas AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Eksik Klasörleri Düzenle
        run: |
          mkdir -p app/src/main/java app/src/main/res
          if [ -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            cp build.gradle app/
          fi
          chmod +x gradlew || true

      - name: APK Derle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --continue || gradle assembleDebug
          else
            echo "Gradlew bulunamadı, genel derleme deneniyor"
          fi

      - name: APK Dosyasını Paketle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
        if: always()
