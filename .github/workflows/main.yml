name: Build Atlas AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dosyaları Doğru Klasörüne Taşı ve Projeyi Hazırla
        run: |
          mkdir -p app/src/main/java/com/example/atlasai app/src/main/res
          
          # Eğer ana dizinde MainActivity.java varsa doğru klasöre taşıyoruz
          if [ -f "MainActivity.java" ]; then
            mv MainActivity.java app/src/main/java/com/example/atlasai/
          fi

          # Eksik gradle dosyaları varsa otomatik oluşturuyoruz
          if [ ! -f "settings.gradle" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } } rootProject.name = "AtlasAI"; include(":app")' > settings.gradle
          fi

      - name: Gradle Build ile Derle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleDebug

      - name: APK Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
        if: always()
