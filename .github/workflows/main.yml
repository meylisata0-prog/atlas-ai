name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/example/app app/src/main/res
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='App'" >> settings.gradle
          echo "plugins { id 'com.android.application' } android { compileSdk 33; defaultConfig { applicationId 'com.example.app'; minSdk 21; targetSdk 33 } }" > app/build.gradle
          echo "<manifest package='com.example.app'></manifest>" > app/src/main/AndroidManifest.xml
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
        if: always()
