name: Build Atlas AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle İzinlerini Ver ve Derle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/gradlew" ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradlew bulunamadı, genel derleme deneniyor"
            gradle assembleDebug --stacktrace || true
          fi

      - name: Tüm APK Dosyalarını Bul ve Paketle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/*.apk
            */**/*.apk
        if: always()
