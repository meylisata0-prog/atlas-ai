name: Build Atlas AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android Projesini Sıfırdan ve Eksiksiz Kur
        run: |
          mkdir -p app/src/main/java/com/example/atlasai app/src/main/res/values app/src/main/res/layout
          
          if [ -f "MainActivity.java" ]; then
            mv MainActivity.java app/src/main/java/com/example/atlasai/
          fi

          echo 'include(":app")' > settings.gradle
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.atlasai"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.atlasai">
              <application
                  android:label="Atlas AI"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          if [ ! -f "app/src/main/java/com/example/atlasai/MainActivity.java" ]; then
            echo 'package com.example.atlasai; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle s) { super.onCreate(s); } }' > app/src/main/java/com/example/atlasai/MainActivity.java
          fi

          gradle wrapper

      - name: APK Derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
        if: always()
