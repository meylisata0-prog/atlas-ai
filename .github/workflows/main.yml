name: Build Atlas AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle İzinlerini Ayarla
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Projeyi Derle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: APK Dosyasını Bul ve Paketle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
        if: always()
